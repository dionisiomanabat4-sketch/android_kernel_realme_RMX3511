name: Build RMX3511 Kernel with MT7601U (TWRP flashable)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: 1
  CROSS_COMPILE: aarch64-linux-gnu-
  DEFCONFIG: RMX3511_athena_defconfig
  # Confirm on the phone with: getprop ro.product.device
  DEVICE_CODENAME: athena

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            build-essential \
            libncurses-dev \
            libssl-dev \
            flex \
            bison \
            libelf-dev \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            pahole \
            zip

      - name: Verify Kernel Source
        run: |
          test -f Makefile || { echo "ERROR: Kernel source not found!"; exit 1; }
          test -f "arch/arm64/configs/$DEFCONFIG" || { echo "ERROR: $DEFCONFIG not found!"; exit 1; }
          test -f drivers/net/wireless/mediatek/mt7601u/Makefile || { echo "ERROR: MT7601U driver source not found!"; exit 1; }
          test -f drivers/net/wireless/mediatek/mt7601u/Kconfig || { echo "ERROR: MT7601U Kconfig not found!"; exit 1; }

      - name: Patch Makefiles for new LLD
        run: |
          # Old kernels pass -plugin-opt=-warn-stack-size to the linker.
          # LLD 13+ rejects it. Remove only that flag, not whole lines,
          # so other flags on the same line are kept.
          files=$(grep -rl --include='Makefile*' --include='*.mk' 'warn-stack-size' . || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs sed -i \
              -e 's/-Wl,-plugin-opt=-warn-stack-size//g' \
              -e 's/-plugin-opt=-warn-stack-size//g'
          fi
          echo "Remaining references (should be none):"
          grep -rn 'warn-stack-size' --include='Makefile*' --include='*.mk' . || echo "none"

      - name: Configure Kernel (MT7601U built in)
        run: |
          make "$DEFCONFIG"

          # The defconfig sets CONFIG_MT7601U twice (=m, then =y), so the
          # file contradicts itself. Remove every existing line for these
          # symbols so only one value is left.
          for sym in WIRELESS WLAN WLAN_VENDOR_MEDIATEK USB CFG80211 MAC80211 MT7601U MODULE_SIG MODULE_SIG_FORCE; do
            sed -i -e "/^CONFIG_${sym}=/d" -e "/^# CONFIG_${sym} is not set/d" .config
          done

          # Built in (=y) avoids module version magic, MODVERSIONS and
          # signing mismatches entirely. MT7601U depends on MAC80211, which
          # depends on CFG80211. If MAC80211 is a module, MT7601U cannot be
          # built in, so all three are set to =y here.
          printf '%s\n' \
            CONFIG_WIRELESS=y \
            CONFIG_WLAN=y \
            CONFIG_WLAN_VENDOR_MEDIATEK=y \
            CONFIG_USB=y \
            CONFIG_CFG80211=y \
            CONFIG_MAC80211=y \
            CONFIG_MT7601U=y \
            '# CONFIG_MODULE_SIG is not set' >> .config

          make olddefconfig

          echo "Final driver configuration:"
          grep -E '^CONFIG_(WIRELESS|WLAN|WLAN_VENDOR_MEDIATEK|USB|CFG80211|MAC80211|MT7601U)=' .config || true

          if [ "$(grep -c '^CONFIG_MT7601U=' .config)" -ne 1 ] || ! grep -qx 'CONFIG_MT7601U=y' .config; then
            echo "ERROR: CONFIG_MT7601U=y is not set after olddefconfig"
            echo "--- MT7601U Kconfig ---"
            cat drivers/net/wireless/mediatek/mt7601u/Kconfig
            echo "--- Dependency state ---"
            grep -E '^(# )?CONFIG_(WIRELESS|WLAN|WLAN_VENDOR_MEDIATEK|USB|CFG80211|MAC80211)[ =]' .config || true
            exit 1
          fi

          if grep -qE '^CONFIG_MODULE_SIG(_FORCE)?=y' .config; then
            echo "ERROR: module signing is enabled"
            exit 1
          fi

      - name: Build Kernel Image
        run: |
          set -o pipefail
          # KCFLAGS=-Wno-error stops newer clang warnings from failing an
          # otherwise valid build. Real compile errors still fail the step.
          make -j"$(nproc)" KCFLAGS=-Wno-error Image.gz-dtb 2>&1 | tee build.log || {
            echo "=========== BUILD FAILED ==========="
            grep -nE "error:|fatal error|No rule|\*\*\*" build.log | head -n 50
            exit 1
          }
          test -f arch/arm64/boot/Image.gz-dtb || { echo "ERROR: Image.gz-dtb was not produced"; exit 1; }
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/README.md
          cp arch/arm64/boot/Image.gz-dtb anykernel/

          # Only the codename is changed. devicecheck stays on, so the zip
          # refuses to flash on any other device.
          sed -i "s/^device.name1=.*/device.name1=${DEVICE_CODENAME}/" anykernel/anykernel.sh
          grep -E '^(do\.devicecheck|device\.name1)=' anykernel/anykernel.sh

          mkdir -p out
          ZIP="out/MT7601U-${DEVICE_CODENAME}-$(date +%Y%m%d).zip"
          (cd anykernel && zip -r9 "../$ZIP" . -x '*.git*')
          unzip -l "$ZIP"

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: MT7601U-kernel-${{ env.DEVICE_CODENAME }}
          path: out/*.zip
          if-no-files-found: error

      - name: Upload Build Log and Config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-config
          path: |
            build.log
            .config
          if-no-files-found: warn
