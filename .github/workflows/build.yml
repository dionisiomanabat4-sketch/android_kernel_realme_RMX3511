name: Build MT7601U Module

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: 1
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            build-essential \
            libncurses-dev \
            libssl-dev \
            flex \
            bison \
            libelf-dev \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            pahole

      - name: Verify Kernel Source
        run: |
          test -f Makefile || { echo "ERROR: Kernel source not found!"; exit 1; }

          test -f arch/arm64/configs/RMX3511_athena_defconfig || {
            echo "ERROR: RMX3511 defconfig not found!"
            exit 1
          }

          test -f drivers/net/wireless/mediatek/mt7601u/Makefile || {
            echo "ERROR: MT7601U driver source not found!"
            exit 1
          }

          test -f drivers/net/wireless/mediatek/mt7601u/Kconfig || {
            echo "ERROR: MT7601U Kconfig not found!"
            exit 1
          }

      - name: Patch Makefiles for new LLD
        run: |
          # Old kernels pass -plugin-opt=-warn-stack-size to the linker.
          # LLD 13+ removed that option, which breaks the vDSO link.
          echo "Before:"
          grep -rn "warn-stack-size" Makefile arch/arm64/Makefile || true

          sed -i '/-plugin-opt=-warn-stack-size/d' Makefile arch/arm64/Makefile

          echo "After:"
          grep -rn "warn-stack-size" Makefile arch/arm64/Makefile || echo "removed"

      - name: Configure Kernel
        run: |
          make RMX3511_athena_defconfig

          # MT7601U sits inside "if WLAN_VENDOR_MEDIATEK" and depends on
          # WIRELESS + WLAN + USB + MAC80211. If any of these is off,
          # olddefconfig silently drops CONFIG_MT7601U.
          scripts/config --file .config \
            -e WIRELESS \
            -e WLAN \
            -e WLAN_VENDOR_MEDIATEK \
            -e USB \
            -m CFG80211 \
            -m MAC80211 \
            -m MT7601U

          make olddefconfig

          echo "Checking MT7601U configuration..."
          grep -E 'CONFIG_(MT7601U|MAC80211|CFG80211|WLAN_VENDOR_MEDIATEK)=' .config || true

          if ! grep -q '^CONFIG_MT7601U=m' .config; then
            echo "ERROR: MT7601U is not enabled as a module!"

            echo "--- MT7601U Kconfig ---"
            cat drivers/net/wireless/mediatek/mt7601u/Kconfig

            echo "--- Dependency state in .config ---"
            grep -E 'CONFIG_(WIRELESS|WLAN|WLAN_VENDOR_MEDIATEK|USB|MAC80211|CFG80211)[= ]' .config || true

            echo "--- Is the driver sourced by Kconfig? ---"
            grep -n "mediatek" drivers/net/wireless/Kconfig || echo "mediatek/Kconfig NOT sourced in wireless/Kconfig"
            grep -n "mt7601u" drivers/net/wireless/mediatek/Kconfig || echo "mt7601u/Kconfig NOT sourced in mediatek/Kconfig"

            echo "--- Is the driver in the Makefile? ---"
            grep -n "mediatek" drivers/net/wireless/Makefile || echo "mediatek NOT in wireless/Makefile"

            exit 1
          fi

      - name: Prepare Kernel
        run: make modules_prepare

      - name: Compile MT7601U
        run: make -j$(nproc) modules

      - name: Verify and Collect Module
        run: |
          mkdir -p output_mod

          find drivers/net/wireless/mediatek/mt7601u \
            -type f -name "*.ko" \
            -exec cp {} output_mod/ \;

          echo "Checking generated modules..."
          ls -lh output_mod/

          if ! find output_mod -name "mt7601u.ko" | grep -q .; then
            echo "ERROR: mt7601u.ko was not generated!"
            exit 1
          fi

      - name: Upload Driver Module
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-driver-RMX3511
          path: output_mod/*.ko
          if-no-files-found: error
          
