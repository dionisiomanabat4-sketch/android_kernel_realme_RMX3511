name: Build MT7601U Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils flex bison libelf-dev clang lld llvm gcc-aarch64-linux-gnu

    - name: Compile MT7601U Module
      run: |
        echo "CONFIG_MT7601U=m" > drivers_config
        ARCH=arm64 SUBARCH=arm64 scripts/kconfig/merge_config.sh arch/arm64/configs/RMX3511_athena_defconfig drivers_config
        make ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang modules_prepare
        make ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang M=drivers/net/wireless/mediatek/mt7601u modules

    - name: Verify and Find Module
      run: |
        mkdir -p output_mod
        find drivers/net/wireless/ -name "*.ko" -exec cp {} output_mod/ \;

    - name: Upload Driver Module
      uses: actions/upload-artifact@v4
      with:
        name: mt7601u-driver
        path: output_mod/
        
