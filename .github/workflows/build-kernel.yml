name: Build Athena Kernel (MT7601U built-in)

on:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: "Phone kernel version - paste the output of: uname -r. Strongly recommended if the phone loads any kernel modules from its own partitions. Empty = keep the source's own version."
        required: false
        default: ""
      image_format:
        description: "Kernel image format to package. Use Image.gz-dtb if the stock kernel has its dtb appended."
        required: false
        default: "Image"
        type: choice
        options:
          - Image
          - Image.gz
          - Image.gz-dtb

env:
  KERNEL_RELEASE: ${{ inputs.kernel_release }}
  IMAGE_FORMAT: ${{ inputs.image_format }}
  ARCH: arm64
  SUBARCH: arm64
  LLVM: 1
  CROSS_COMPILE: aarch64-linux-gnu-
  # Confirm on the phone with: getprop ro.product.device
  DEVICE_CODENAME: athena
  # The kernel's build.config.common asks for AOSP clang r416183b (clang 12)
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz
  FW_URL: https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mt7601u.bin

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev lz4 python3 \
            xz-utils zip unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download Android Clang r416183b
        run: |
          mkdir -p "$HOME/clang"
          curl -fL --retry 5 --retry-delay 5 "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C "$HOME/clang"
          rm -f clang.tar.gz

          # The archive may or may not have a top-level folder, so find the
          # clang binary instead of assuming a fixed path.
          clang_bin_dir="$(dirname "$(find "$HOME/clang" -path '*/bin/clang' | head -n 1)")"
          if [ ! -x "$clang_bin_dir/clang" ]; then
            echo "ERROR: clang binary not found in the archive"
            find "$HOME/clang" -maxdepth 2 | head -n 30
            exit 1
          fi
          echo "$clang_bin_dir" >> "$GITHUB_PATH"
          "$clang_bin_dir/clang" --version

      - name: Verify Kernel Source
        run: |
          test -f Makefile || { echo "ERROR: Kernel source not found!"; exit 1; }
          test -f arch/arm64/configs/RMX3511_athena_defconfig || {
            echo "ERROR: RMX3511_athena_defconfig not found!"
            exit 1
          }
          test -f drivers/net/wireless/mediatek/mt7601u/Makefile || {
            echo "ERROR: MT7601U driver Makefile not found!"
            exit 1
          }
          test -f drivers/net/wireless/mediatek/mt7601u/Kconfig || {
            echo "ERROR: MT7601U driver Kconfig not found!"
            exit 1
          }

      - name: Get MT7601U firmware
        run: |
          mkdir -p firmware
          if ! curl -fL --retry 3 --retry-delay 5 -o firmware/mt7601u.bin "$FW_URL"; then
            echo "kernel.org download failed, trying the Ubuntu package"
            sudo apt-get install -y linux-firmware
            cp /lib/firmware/mt7601u.bin firmware/mt7601u.bin
          fi
          ls -l firmware/mt7601u.bin
          test -s firmware/mt7601u.bin

      - name: Configure Kernel
        run: |
          make O=out RMX3511_athena_defconfig

          # MT7601U built in. cfg80211 and mac80211 are built in too, because
          # a built-in driver cannot depend on a module. Module signing off.
          scripts/config --file out/.config \
            -e WIRELESS \
            -e WLAN \
            -e WLAN_VENDOR_MEDIATEK \
            -e USB \
            -e CFG80211 \
            -e MAC80211 \
            -e MT7601U \
            -d MODULE_SIG \
            -d MODULE_SIG_FORCE

          # Embed the adapter firmware. The path must be absolute: with O=out,
          # relative paths are resolved from the output folder, not the source.
          scripts/config --file out/.config \
            -e FW_LOADER \
            --set-str EXTRA_FIRMWARE "mt7601u.bin" \
            --set-str EXTRA_FIRMWARE_DIR "$PWD/firmware"

          # Make the version string match the phone's running kernel.
          # Accepts whatever was pasted: extra spaces, a trailing newline,
          # or a whole `uname -a` line. Only the release token is kept.
          want="$(printf '%s\n' "$KERNEL_RELEASE" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*' | head -n 1 || true)"

          if [ -n "$want" ]; then
            src_ver="$(make -s kernelversion)"    # e.g. 5.4.256-rev6
            src_num="$(printf '%s' "$src_ver" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)"
            want_num="$(printf '%s' "$want" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)"

            # Only the number (5.4.256) has to match the source tree. Whatever
            # follows it is the phone's own suffix and is used as-is.
            if [ "$want_num" != "$src_num" ]; then
              echo "ERROR: the phone runs $want_num but this source tree is $src_num"
              echo "       phone:  $want"
              echo "       source: $src_ver"
              echo "       Paste the uname -r of the kernel this source belongs to,"
              echo "       or leave kernel_release empty."
              exit 1
            fi

            suffix="${want#"$want_num"}"
            echo "Phone kernel : $want"
            echo "Source tree  : $src_ver"
            echo "Local version: '$suffix'"

            # The Makefile's own EXTRAVERSION (-rev6) sits in front of
            # CONFIG_LOCALVERSION. Clear it so the phone's suffix is the
            # whole story.
            sed -i 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION =/' Makefile
            if [ "$(make -s kernelversion)" != "$src_num" ]; then
              echo "ERROR: could not clear EXTRAVERSION in Makefile"
              grep -n '^EXTRAVERSION' Makefile || true
              exit 1
            fi

            # Stop git from adding "+" / "-dirty" / "-g<hash>" to the release
            : > .scmversion

            scripts/config --file out/.config \
              --set-str LOCALVERSION "$suffix" \
              -d LOCALVERSION_AUTO

            # Remembered for the check in the Build step
            echo "WANT_RELEASE=$want" >> "$GITHUB_ENV"
          elif [ -n "${KERNEL_RELEASE//[[:space:]]/}" ]; then
            echo "ERROR: no kernel version (like 5.4.256-xxx) found in kernel_release: '$KERNEL_RELEASE'"
            exit 1
          fi

          make O=out olddefconfig

          echo "=========== Resulting config ==========="
          grep -E '^CONFIG_(MT7601U|MAC80211|CFG80211|WLAN_VENDOR_MEDIATEK|FW_LOADER|EXTRA_FIRMWARE|EXTRA_FIRMWARE_DIR|LOCALVERSION|MODULE_SIG|MODVERSIONS|LTO|CFI)' out/.config || true

          if ! grep -q '^CONFIG_MT7601U=y' out/.config; then
            echo "ERROR: MT7601U is not enabled as built-in!"
            cat drivers/net/wireless/mediatek/mt7601u/Kconfig
            grep -E 'CONFIG_(WIRELESS|WLAN|WLAN_VENDOR_MEDIATEK|USB|MAC80211|CFG80211)[= ]' out/.config || true
            grep -n "mediatek" drivers/net/wireless/Kconfig || echo "mediatek/Kconfig NOT sourced in wireless/Kconfig"
            grep -n "mt7601u" drivers/net/wireless/mediatek/Kconfig || echo "mt7601u/Kconfig NOT sourced in mediatek/Kconfig"
            grep -n "mediatek" drivers/net/wireless/Makefile || echo "mediatek NOT in wireless/Makefile"
            exit 1
          fi

          if ! grep -qx 'CONFIG_EXTRA_FIRMWARE="mt7601u.bin"' out/.config; then
            echo "ERROR: mt7601u.bin is not set to be built into the kernel"
            grep -E '^CONFIG_(FW_LOADER|EXTRA_FIRMWARE)' out/.config || true
            exit 1
          fi

          if grep -qE '^CONFIG_MODULE_SIG(_FORCE)?=y' out/.config; then
            echo "ERROR: module signing is still enabled!"
            exit 1
          fi

      - name: Build Kernel
        run: |
          set -o pipefail
          : > build.log

          run_make() {
            make O=out -j"$(nproc)" "$@" 2>&1 | tee -a build.log || {
              echo "=========== COMPILER ERRORS ==========="
              grep -nE "error:|fatal error|undefined reference|\*\*\*" build.log | head -n 40
              exit 1
            }
          }

          # Generate the version headers first, so a release mismatch fails
          # in about a minute instead of after the whole compile.
          run_make prepare

          release="$(cat out/include/config/kernel.release)"
          echo "Kernel release: $release"

          if [ -n "$WANT_RELEASE" ] && [ "$release" != "$WANT_RELEASE" ]; then
            echo "ERROR: built release '$release' does not match the phone's '$WANT_RELEASE'"
            grep -E '^CONFIG_LOCALVERSION' out/.config || true
            ls -la localversion* out/localversion* .scmversion 2>/dev/null || true
            exit 1
          fi

          run_make "$IMAGE_FORMAT"

          # Always build the uncompressed Image too. It is the file the
          # firmware check below reads, and it is a no-op if already built.
          run_make Image

          ls -lh out/arch/arm64/boot/
          strings -a out/arch/arm64/boot/Image > image_strings.txt

          if ! grep -q 'mt7601u.bin' image_strings.txt; then
            echo "ERROR: mt7601u.bin firmware is not embedded in the kernel image"
            exit 1
          fi
          echo "mt7601u driver strings found: $(grep -c mt7601u image_strings.txt)"

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE

          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 - kernel-only flash for RMX3511
          properties() { '
          kernel.string=Athena Kernel RMX3511 (MT7601U built-in)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # replace only the kernel, leave the ramdisk untouched
          split_boot;
          flash_boot;
          EOF

          # Set the device codename. devicecheck stays on, so the zip refuses
          # to flash on any other device.
          sed -i "s/^device.name1=.*/device.name1=${DEVICE_CODENAME}/" ak3/anykernel.sh
          grep -E '^(do\.devicecheck|device\.name1)=' ak3/anykernel.sh

          cp "out/arch/arm64/boot/$IMAGE_FORMAT" ak3/

          mkdir -p release
          ZIP="release/Athena-RMX3511-MT7601U-${DEVICE_CODENAME}.zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x ".git*")

          # Confirm the zip is intact and contains the kernel and installer
          unzip -tq "$ZIP"
          unzip -l "$ZIP"

          cp "out/arch/arm64/boot/$IMAGE_FORMAT" release/
          cp out/.config release/kernel-config.txt
          ls -lh release/

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: athena-kernel-RMX3511-mt7601u
          path: release/*
          if-no-files-found: error
          retention-days: 14
